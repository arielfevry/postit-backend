services:
  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_ISSUER: ${JWT_ISSUER:-postit-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-postit-api}
      REMINDER_DELIVERY_MODE: ${REMINDER_DELIVERY_MODE:-mock}
      REMINDER_WORKER_ENABLED: ${REMINDER_WORKER_ENABLED:-false}
      REMINDER_POLL_INTERVAL_MS: ${REMINDER_POLL_INTERVAL_MS:-5000}
      REMINDER_LEASE_MS: ${REMINDER_LEASE_MS:-60000}
      REMINDER_PROVIDER_TIMEOUT_MS: ${REMINDER_PROVIDER_TIMEOUT_MS:-10000}
      REMINDER_MAX_ATTEMPTS: ${REMINDER_MAX_ATTEMPTS:-3}
      REMINDER_RETRY_BASE_MS: ${REMINDER_RETRY_BASE_MS:-30000}
      REMINDER_BATCH_SIZE: ${REMINDER_BATCH_SIZE:-20}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:-}
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/PostItDB
    command: npm run dev
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: docker.io/mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
